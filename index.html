<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CK Web</title><link rel="stylesheet" href="styles.css"></head><body><section id="auth"><h1>CK•WEB<br><em>AI 工作台</em></h1><form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="密碼" required><button>登入</button></form><button id="signup">建立帳號</button><button id="google">Google 登入</button><small id="notice"></small></section><main id="app" class="hidden"><aside><b>CK<span>•</span>WEB</b><button id="new-project">＋ 新增專案</button><p>專案　<span>● 工作器</span></p><nav id="projects"></nav><button id="logout">登出</button></aside><section class="chat"><header><div><small id="project-kicker">選擇一個專案</small><h1 id="project-title">你的 AI 工作台</h1></div></header><div id="messages"><div class="empty">從左側建立或選擇專案，開始與 Codex 對話。</div></div><form id="composer" class="hidden"><textarea id="prompt" placeholder="交代一個工作給 Codex…" required></textarea><button>↑</button></form></section></main><dialog id="project-dialog"><form id="project-form"><h2>新增專案</h2><input name="name" placeholder="專案名稱" required><textarea name="description" placeholder="專案說明"></textarea><button>建立專案 →</button></form></dialog><script src="supabase-config.js"></script><script type="module" src="app.js"></script></body></html>
